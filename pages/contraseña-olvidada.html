<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Contraseña Olvidada</title>
</head>
<body class="bg-secondary-color wv-100 hdv-100 d-flex flex-column justify-content-between">
    <header class="login-header d-flex title-xl font-family terciary-color justify-content-center aling-items-center gap-2 p-3 h-auto rounded">
        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
        <h2>Huellitas</h2>
    </header>
    <main class="login-main flex-grow-1 d-flex flex-column justify-content-center gap-3 px-2 py-3 d-lg-grid p-lg-0 ">
        <div class="login-layout d-flex flex-column w-100 gap-3 justify-content-lg-center p-lg-2">
            <div class="d-flex flex-column justify-content-center aling-items-center gap-2 primary-color">
                <h1>Recuperar Contraseña</h1>
                <p class="text-center">Ingrese su correo y le enviaremos un enlace para restablecer su contraseña</p>
            </div>
            <form class="">
                <fieldset class="d-flex flex-column gap-2 p-2">
                    <legend>Credenciales</legend>
                
                    <div class="d-flex flex-column gap-1">
                        <label for="email">Correo Electrónico <span class="warning-color">*</span> </label>
                        <input id="email" name="email" type="email" required autocomplete="email" placeholder="ejemplo@huellitas.com">
                    </div>

                    <button type="submit" class="d-flex secondary-color bg-terciary-color justify-content-center aling-items-center gap-1 mt-2 bd-none p-1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send preview-icon"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg> Iniciar Sesión</button>
                    <div class="d-flex justify-content-center">
                        <a class="d-flex justify-content-center aling-items-center gap-2 a-decoration-none primary-color mt-3" href="pages/pantalla-principal-recepcionista.html"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-left preview-icon"><path d="M6 8L2 12L6 16"/><path d="M2 12H22"/></svg>  Volver a inicar sesión</a>
                    </div>
                </fieldset>
            </form>
        </div>
        <div class="login-image-wrapper d-none d-lg-block w-100 h-100 d-lg-block">
            <img class="d-lg-block w-100 h-100" src="../img/login-image.jpg" alt="Clínica Veterinaria Huellitas">
        </div>
    </main>
    <footer class="login-footer h-auto py-3 px-2 text-pretty rounded text-lg-center">
        <p> © 2026 Clínica Veterinaria Huellitas - Sistema de Gestión Interna</p>
    </footer>
</body>
</html>
