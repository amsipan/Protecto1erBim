<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Nueva Mascota</title>
</head>
<body class="bg-secondary-color hdv-100 d-flex flex-column justify-content-between">
    <header class="mascotas-header d-flex flex-column flex-lg-row justify-content-between aling-items-center gap-2 p-2 bg-cream-color">
        <div class="d-flex aling-items-center gap-2 primary-color title-xl">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
            <h2>Huellitas</h2>
        </div>
        <div class="header-options text-color d-flex flex-column flex-lg-row gap-2 justify-content-center aling-items-center w-lg-25">
            <select name="rol" id="rol" class="rounded p-1 w-100 w-lg-50">
                <option value="">Recepcionista</option>
                <option value="">Veterinario</option>
                <option value="">Administrador</option>
            </select>
            <a href="../index.html" class="cerrar-sesion menu-button w-50 w-lg-50 rounded p-1 aling-self-end bd-none bg-grey-color parrafo text-center a-decoration-none">Cerrar Sesión</a>
        </div>
    </header>
    <main class="p-1 aling-self-lg-center w-lg-50">
        <div class="d-flex flex-column mb-3">
            <h1 class="title">Registrar Mascota</h1>
            <p class="parrafo">Complete los datos para registrar una nueva mascota</p>
        </div>
        <form action="pantalla-principal-recepcionista.html">
            <fieldset class="form-propietario d-flex flex-column gap-2 p-2 rounded d-lg-grid">
                <legend>Datos de la mascota</legend>
                <div class="d-flex flex-column gap-1">
                    <label for="cedula_prop">Cédula del propietario</label>
                    <input id="cedula_prop" type="text" required minlength="10" maxlength="10" title="Debe contener 10 dígitos numéricos" placeholder="0123456789" pattern="[0-9]{10}">
                    <span class="span terciary-color"> Debe contener 10 dígitos numéricos</span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="nombre_mascota">Nombre de la Mascota</label>
                    <input id="nombre_mascota" type="text" required minlength="2" maxlength="30" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,30}">
                    <span class="span terciary-color"> Máximo 30 caracteres</span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="especie">Especie</label>
                    <input id="especie" type="text" required minlength="2" maxlength="30" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,30}">
                    <span class="span terciary-color"> Máximo 30 caracteres</span>
                </div>

                <fieldset class="bd-none d-flex gap-2">
                    <legend class="mb-1">Sexo <span class="warning-color">*</span></legend>
                    <label for="sexo_macho" class="d-flex aling-items-center gap-1">
                        <input id="sexo_macho" type="radio" name="sexo_mascota" value="macho" required checked>
                        Macho
                    </label>
                    <label for="sexo_hembra" class="d-flex aling-items-center gap-1">
                        <input id="sexo_hembra" type="radio" name="sexo_mascota" value="hembra" required>
                        Hembra
                    </label>
                </fieldset>
            </fieldset>
        </form>
    </main>


</body>
</html>
