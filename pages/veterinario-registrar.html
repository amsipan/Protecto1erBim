<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Veterinario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-secondary-color d-flex flex-column justify-content-between hdv-100">
    <header class="title-xl d-flex flex-column justify-content-between aling-items-center p-2 gap-3 flex-lg-row bg-lg-cream-color">
        <div class="d-flex gap-1 justify-content-center aling-items-center terciary-color">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
            <h2>Huellitas</h2>
        </div>
        <a href="../index.html" class="text-color cerrar-sesion menu-button rounded p-2 px-3 w-fit aling-self-center bd-none bg-grey-color parrafo text-center a-decoration-none">Cerrar Sesión</a>
    </header>
    <main class="p-1 aling-self-lg-center w-lg-50">
        <div class="d-flex flex-column mb-3">
            <h1 class="title text-pretty">Registrar Veterinario</h1>
            <p class="parrafo text-pretty">Complete los datos para registrar un nuevo veterinario </p>
        </div>
        <form method="get" action="veterinarios-listar.html">
            <fieldset class="form-propietario d-flex flex-column gap-2 p-2 rounded d-lg-grid">
                <legend>Datos del veterinario</legend>

                <div class="d-flex flex-column gap-1">
                    <label for="cedula">Cédula de Identidad  <span class="warning-color">*</span></label>
                    <input class="rounded" id="cedula" type="text" required minlength="10" maxlength="10" title="Cedula de identidad" placeholder="Ej. 1712345678" pattern="[0-9]{10}">
                    <span class="span"></span>
                    <span class="span terciary-color"> 10 dígitos </span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="telefono">Teléfono celular <span class="warning-color">*</span></label>
                    <input class="rounded" id="telefono" type="tel" required minlength="10" maxlength="10" pattern="09[0-9]{8}" placeholder="Ej. 0987654321" title="Teléfono de contacto">
                    <span class="span"></span>
                    <span class="span terciary-color"> 10 dígitos, inicia con 09 </span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="nombres">Nombres  <span class="warning-color">*</span></label>
                    <input class="rounded" id="nombres" type="text" required minlength="2" maxlength="50" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,50}" placeholder=" " title="Nombre del propietario">
                    <span class="span"></span>
                    <span class="span terciary-color"> Solo letras </span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="apellidos">Apellidos <span class="warning-color">*</span></label>
                    <input class="rounded" id="apellidos" type="text" required minlength="2" maxlength="50" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,50}" placeholder=" " title="Apellido del propietario">
                    <span class="span"></span>
                    <span class="span terciary-color"> Solo letras </span>
                </div>

                <div class="d-flex flex-column gap-1 grid-lg-full-width">
                    <label for="email">Correo Electrónico <span class="warning-color">*</span></label>
                    <input class="rounded" id="email" type="email" required placeholder="Ej. ejemplo@huellitas.vet" title="Email de contacto">
                    <span class="span"></span>
                </div>

                <div class="d-flex flex-column gap-1 grid-lg-full-width">
                    <label for="direccion">Dirección <span class="warning-color">*</span></label>
                    <input class="rounded" id="direccion" type="text" required minlength="5" maxlength="150" placeholder="Ej: Av. Amazonas N34-12 y Mariana de Jesús" title="Ubicación">
                    <span class="span"></span>
                </div>

                <div class="d-flex flex-column gap-2 mt-2 flex-lg-row justify-content-lg-center grid-lg-full-width">
                    <button type="submit" class="menu-button bd-none rounded p-2 bg-terciary-color secondary-color parrafo w-lg-25">Registrar</button>
                    <a class="menu-button bg-grey-color a-decoration-none text-color p-2 text-center rounded w-lg-25" href="veterinarios-listar.html">Cancelar</a>
                </div>
            </fieldset>
        </form> 
    </main>
    <footer class="p-3 text-pretty">
        <p>© 2026 Clínica Veterinaria Huellitas - Sistema de Gestión Interna</p>
    </footer>
</body>
</html>
