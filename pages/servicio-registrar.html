<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Servicio</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-secondary-color d-flex flex-column justify-content-between hdv-100">

    <header class="d-flex flex-column flex-lg-row justify-content-between aling-items-center title-xl p-2 gap-3 bg-lg-cream-color">

        <div class="d-flex gap-1 justify-content-center aling-items-center terciary-color">

            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon">
                <circle cx="11" cy="4" r="2"/>
                <circle cx="18" cy="8" r="2"/>
                <circle cx="20" cy="16" r="2"/>
                <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>
            </svg>

            <h2>Huellitas</h2>

        </div>

        <div class="d-flex flex-column flex-lg-row gap-2 aling-items-center justify-content-center text-color header-options">

            <select name="roles" id="roles" class="w-100 w-lg-50 rounded p-1">
                <option value="">Recepcionista</option>
                <option value="">Veterinario</option>
                <option value="" selected>Administrador</option>
            </select>

            <a href="../index.html" class="cerrar-sesion menu-button w-50 w-lg-50 rounded p-1 aling-self-end bd-none bg-grey-color parrafo text-center a-decoration-none text-color">
                Cerrar Sesión
            </a>

        </div>

    </header>

    <main class="p-1 aling-self-lg-center w-lg-50">

        <div class="d-flex flex-column mb-3">

            <h1 class="title text-pretty">Registrar Servicio</h1>

            <p class="parrafo text-pretty">
                Complete los datos para registrar un nuevo servicio.
            </p>

        </div>

        <form method="get" action="servicios-listar.html">

            <fieldset class="form-propietario d-flex flex-column gap-2 p-2 rounded d-lg-grid">

                <legend>Datos del servicio</legend>

                <!-- Nombre del servicio -->

                <div class="d-flex flex-column gap-1">

                    <label for="nombreServicio">
                        Nombre del servicio <span class="warning-color">*</span>
                    </label>

                    <input
                        id="nombreServicio"
                        name="nombreServicio"
                        type="text"
                        required
                        minlength="3"
                        maxlength="50"
                        placeholder="Ej. Consulta general"
                        title="Ingrese un nombre de entre 3 y 50 caracteres"
                    >

                    <span class="span"></span>

                    <span class="span terciary-color">
                        Debe ser único dentro del catálogo.
                    </span>

                </div>

                <!-- Precio del servicio -->

                <div class="d-flex flex-column gap-1">

                    <label for="precio">
                        Precio (USD) <span class="warning-color">*</span>
                    </label>

                    <input
                        id="precio"
                        name="precio"
                        type="number"
                        required
                        min="1"
                        max="500"
                        step="0.01"
                        placeholder="Ej. 25.00"
                        title="Ingrese un precio entre $1.00 y $500.00"
                    >

                    <span class="span"></span>

                    <span class="span terciary-color">
                        Entre $1.00 y $500.00
                    </span>

                </div>

                <!-- Descripción del servicio -->

                <div class="d-flex flex-column gap-1 grid-lg-full-width">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        maxlength="250"
                        class="w-100 rounded p-1"
                        placeholder="Ingrese una descripción del servicio..."
                    ></textarea>

                    <span class="span terciary-color">
                        Opcional. Máximo 250 caracteres.
                    </span>

                </div>

                <!-- Botones -->

                <div class="d-flex flex-column gap-2 mt-2 flex-lg-row justify-content-lg-center grid-lg-full-width">

                    <button
                        type="submit"
                        class="menu-button bd-none rounded p-2 bg-terciary-color secondary-color parrafo w-lg-25">
                        Registrar
                    </button>

                    <a
                        href="servicios-listar.html"
                        class="bg-grey-color a-decoration-none text-color p-2 text-center rounded w-lg-25">
                        Cancelar
                    </a>

                </div>

            </fieldset>

        </form>

    </main>

    <footer class="p-3 text-pretty">

        <p>
            © 2026 Clínica Veterinaria Huellitas - Sistema de Gestión Interna
        </p>

    </footer>

</body>
</html>
