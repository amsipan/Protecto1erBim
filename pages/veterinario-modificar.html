<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Veterinario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-secondary-color d-flex flex-column justify-content-between hdv-100">
    <header class="d-flex flex-column flex-lg-row justify-content-between aling-items-center title-xl p-2 gap-3 bg-lg-cream-color">
        <div class="d-flex gap-1 justify-content-center aling-items-center terciary-color">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
            <h2> Huellitas </h2>
        </div>
        <div class="d-flex flex-column flex-lg-row gap-2 aling-items-center justify-content-center text-color header-options">
            <select name="roles" id="roles" class="w-100 w-lg-50 rounded p-1">
                <option value=""> Recepcionista </option>
                <option value=""> Veterinario </option>
                <option value="" selected> Administrador </option>
            </select>
            <a href="../index.html" class="cerrar-sesion menu-button w-50 w-lg-50 rounded p-1 aling-self-end bd-none bg-grey-color parrafo text-center a-decoration-none text-color">Cerrar Sesión</a>
        </div>
    </header>
    <main class="p-1 aling-self-lg-center w-lg-50">
        <div class="d-flex flex-column mb-3">
            <h1 class="title text-pretty">Editar Veterinario</h1>
            <p class="parrafo text-pretty">Actualice la información del veterinario. La cédula no se puede modificar. </p>
        </div>
        <form method="get" action="veterinarios-listar.html">
            <fieldset class="form-propietario d-flex flex-column gap-2 p-2 rounded d-lg-grid">
                <legend>Datos del veterinario</legend>

                <div class="d-flex flex-column gap-1">
                    <label for="cedula">Cédula de Identidad</label>
                    <input id="cedula" type="text" readonly minlength="10" maxlength="10" title="Campo no editable" value="1712345678" class="bg-grey-color">
                    <span class="span terciary-color"> Valor solo de lectura </span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="telefono">Teléfono celular <span class="warning-color">*</span></label>
                    <input id="telefono" type="tel" required minlength="10" maxlength="10" pattern="09[0-9]{8}" value="0987654321" title="Debe contener 10 dígitos numéricos e iniciar con 09">
                    <span class="span"></span>
                    <span class="span terciary-color"> 10 dígitos, inicia con 09 </span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="nombres">Nombres  <span class="warning-color">*</span></label>
                    <input id="nombres" type="text" required minlength="2" maxlength="50" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,50}" value="Ana Lucía">
                    <span class="span"></span>
                    <span class="span terciary-color"> Solo letras </span>
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="apellidos">Apellidos <span class="warning-color">*</span></label>
                    <input id="apellidos" type="text" required minlength="2" maxlength="50" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,50}" value="Torres Vega">
                    <span class="span"></span>
                    <span class="span terciary-color"> Solo letras </span>
                </div>

                <div class="d-flex flex-column gap-1 grid-lg-full-width">
                    <label for="email">Correo Electrónico <span class="warning-color">*</span></label>
                    <input id="email" type="email" required value="a.torres@huellitas.vet">
                    <span class="span"></span>
                </div>

                <div class="d-flex flex-column gap-1 grid-lg-full-width">
                    <label for="direccion">Dirección <span class="warning-color">*</span></label>
                    <input id="direccion" type="text" required minlength="5" maxlength="150" value="Av. Amazonas N34-12 y Mariana de Jesús">
                    <span class="span"></span>
                </div>

                <div class="d-flex flex-column gap-2 mt-2 flex-lg-row justify-content-lg-center grid-lg-full-width">
                    <button type="submit" class="menu-button bd-none rounded p-2 bg-terciary-color secondary-color parrafo w-lg-25">Guardar Cambios</button>
                    <a class="bg-grey-color a-decoration-none text-color p-2 text-center rounded w-lg-25" href="veterinarios-listar.html">Cancelar</a>
                </div>
            </fieldset>
        </form> 
    </main>
    <footer class="p-3 text-pretty">
        <p>© 2026 Clínica Veterinaria Huellitas - Sistema de Gestión Interna</p>
    </footer>
</body>
</html>
