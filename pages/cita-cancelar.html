<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VetCare: cancelación de una cita programada de la clínica veterinaria Huellitas.">
    <link rel="stylesheet" href="../css/style.css">
    <title>Cancelar cita | VetCare – Clínica Veterinaria Huellitas</title>
</head>
<body class="bg-secondary-color hdv-100 d-flex flex-column justify-content-between">
    <header class="title-xl d-flex flex-column justify-content-between aling-items-center p-2 gap-3 flex-lg-row bg-lg-cream-color">
        <div class="d-flex gap-1 justify-content-center aling-items-center terciary-color">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
            <h2>Huellitas</h2>
        </div>
        <a href="../index.html" class="text-color cerrar-sesion menu-button rounded p-2 px-3 w-fit aling-self-center bd-none bg-grey-color parrafo text-center a-decoration-none">Cerrar Sesión</a>
    </header>

    <main class="p-1 aling-self-lg-center w-lg-75">
        <section class="d-flex flex-column gap-3" aria-labelledby="titulo-cancelar">

            <h1 id="titulo-cancelar" class="title-xl">Cancelar Cita</h1>

            <p id="advertencia-cancelar" class="bg-warning-area-color d-flex p-2 gap-2 parrafo aling-items-center rounded bd-warning-area">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="warning-svg warning-color" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                <span class="text-pretty">
                    <span class="d-block">¿Está seguro de que desea cancelar esta cita?</span>
                    <span class="title-bold">Esta acción no se puede deshacer.</span>
                </span>
            </p>

            <form action="citas-listar.html" method="get" aria-describedby="advertencia-cancelar">
                <fieldset class="form-propietario d-flex flex-column gap-2 p-2 rounded d-lg-grid">
                    <legend>Datos de la Cita</legend>

                    <!-- Datos de consulta: la cita no se modifica en esta pantalla -->
                    <div class="d-flex flex-column gap-1">
                        <label for="propietario">Propietario</label>
                        <input type="text" id="propietario" name="propietario"
                               value="María Belén Espinoza Castro" readonly
                               class="bg-grey-color" aria-describedby="ayuda-propietario">
                        <span class="span"></span>
                        <small id="ayuda-propietario" class="span terciary-color">Cédula 1712345678</small>
                    </div>

                    <div class="d-flex flex-column gap-1">
                        <label for="mascota">Mascota</label>
                        <input type="text" id="mascota" name="mascota"
                               value="Max (Perro)" readonly class="bg-grey-color">
                        <span class="span"></span>
                    </div>

                    <div class="d-flex flex-column gap-1">
                        <label for="servicio">Servicio</label>
                        <input type="text" id="servicio" name="servicio"
                               value="Consulta general" readonly class="bg-grey-color">
                        <span class="span"></span>
                    </div>

                    <div class="d-flex flex-column gap-1">
                        <label for="veterinario">Veterinario</label>
                        <input type="text" id="veterinario" name="veterinario"
                               value="Dra. Ana Torres" readonly class="bg-grey-color">
                        <span class="span"></span>
                    </div>

                    <div class="d-flex flex-column gap-1">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha"
                               value="2026-11-18" readonly class="bg-grey-color">
                        <span class="span"></span>
                    </div>

                    <div class="d-flex flex-column gap-1">
                        <label for="hora">Hora</label>
                        <input type="time" id="hora" name="hora"
                               value="10:30" readonly class="bg-grey-color">
                        <span class="span"></span>
                    </div>

                    <!-- Regla de negocio: una cita cancelada requiere un motivo (máx. 200 caracteres) -->
                    <div class="d-flex flex-column gap-1 grid-lg-full-width">
                        <label for="motivo">
                            Motivo de cancelación <span class="warning-color" aria-hidden="true">*</span>
                        </label>
                        <textarea id="motivo" name="motivo" rows="3"
                                  maxlength="200" required
                                  placeholder="Ej.: El propietario no puede asistir en esa fecha"
                                  class="w-100 p-1 rounded bd-grey-color"
                                  aria-describedby="ayuda-motivo"></textarea>
                        <small id="ayuda-motivo" class="span terciary-color">Obligatorio, máximo 200 caracteres</small>
                    </div>

                    <div class="d-flex flex-column gap-2 mt-2 flex-lg-row justify-content-lg-center grid-lg-full-width">
                        <button type="submit" class="warning-button bd-none rounded p-2 bg-warning-color secondary-color parrafo w-lg-25">Confirmar cancelación</button>
                        <a class="bg-grey-color a-decoration-none text-color p-2 text-center rounded w-lg-25" href="citas-listar.html">Cancelar</a>
                    </div>
                </fieldset>
            </form>

        </section>
    </main>

    <footer class="p-3">
        <p>© 2026 Clínica Veterinaria Huellitas - Sistema de Gestión Interna</p>
    </footer>
</body>
</html>
