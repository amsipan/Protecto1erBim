<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Veterinario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-secondary-color d-flex flex-column justify-content-between hdv-100">
    <header class="d-flex flex-column flex-lg-row justify-content-between aling-items-center title-xl p-2 gap-3 bg-lg-cream-color">
        <div class="d-flex gap-1 justify-content-center aling-items-center terciary-color">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
            <h2> Huellitas </h2>
        </div>
        <div class="d-flex flex-column flex-lg-row gap-2 aling-items-center justify-content-center text-color header-options">
            <select name="roles" id="roles" class="w-100 w-lg-50 rounded p-1">
                <option value=""> Recepcionista </option>
                <option value=""> Veterinario </option>
                <option value="" selected> Administrador </option>
            </select>
            <a href="../index.html" class="cerrar-sesion menu-button w-50 w-lg-50 rounded p-1 aling-self-end bd-none bg-grey-color parrafo text-center a-decoration-none text-color">Cerrar Sesión</a>
        </div>
    </header>
    <main class="p-1 aling-self-lg-center w-lg-50">
        <div class="p-1 mb-3 gap-2 d-flex bg-warning-area-color bd-warning-area rounded">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" class="warning-color warning-svg" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-triangle-exclamation-point preview-icon"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            <p class="parrafo">¿Está seguro de que desea eliminar a este veterinario? <strong> Esta acción no se puede deshacer</strong> </p>
        </div>
        <div class="flex-column mb-3">
            <h1 class="title text-pretty">Eliminar Veterinario</h1>
        </div>
        <form method="get" action="veterinarios-listar.html">
            <fieldset class="form-propietario d-flex flex-column gap-2 p-2 rounded d-lg-grid">
                <legend>Datos del veterinario</legend>

                <div class="d-flex flex-column gap-1">
                    <label for="cedula">Cédula de Identidad</label>
                    <input id="cedula" type="text" readonly value="1712345678" class="bg-grey-color">
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="telefono">Teléfono celular </label>
                    <input id="telefono" type="tel" readonly value="0987654321" class="bg-grey-color">
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="nombres">Nombres </label>
                    <input id="nombres" type="text" readonly value="Ana Lucía" class="bg-grey-color">
                </div>

                <div class="d-flex flex-column gap-1">
                    <label for="apellidos">Apellidos</label>
                    <input id="apellidos" type="text" readonly value="Torres Vega" class="bg-grey-color">
                </div>

                <div class="d-flex flex-column gap-1 grid-lg-full-width">
                    <label for="email">Correo Electrónico </label>
                    <input id="email" type="email" readonly value="a.torres@huellitas.vet" class="bg-grey-color">
                </div>

                <div class="d-flex flex-column gap-1 grid-lg-full-width">
                    <label for="direccion">Dirección </label>
                    <input id="direccion" type="text" readonly value="Av. Amazonas N34-12 y Mariana de Jesús" class="bg-grey-color">
                </div>

                <div class="d-flex flex-column gap-2 mt-2 flex-lg-row justify-content-lg-center grid-lg-full-width">
                    <button type="submit" class="menu-button bd-none rounded p-2 bg-warning-color secondary-color parrafo w-lg-25">Eliminar Veterinario</button>
                    <a class="bg-grey-color a-decoration-none text-color p-2 text-center rounded w-lg-25" href="veterinarios-listar.html">Regresar</a>
                </div>
            </fieldset>
        </form> 
    </main>
    <footer class="p-3 text-pretty">
        <p>© 2026 Clínica Veterinaria Huellitas - Sistema de Gestión Interna</p>
    </footer>
</body>
</html>
