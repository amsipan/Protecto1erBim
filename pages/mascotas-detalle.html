<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Detalle de Mascota</title>
</head>
<body class="bg-secondary-color hdv-100 d-flex flex-column justify-content-between">
    <header class="title-xl d-flex flex-column justify-content-between aling-items-center p-2 gap-3 flex-lg-row bg-lg-cream-color">
        <div class="d-flex gap-1 justify-content-center aling-items-center terciary-color">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print preview-icon"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
            <h2>Huellitas</h2>
        </div>
        <a href="../index.html" class="text-color cerrar-sesion menu-button rounded p-2 px-3 w-fit aling-self-center bd-none bg-grey-color parrafo text-center a-decoration-none">Cerrar Sesión</a>
    </header>
    <main class="p-1 aling-self-lg-center w-lg-75 d-flex flex-column gap-2">
        <h1 class="title-xl">Detalle de Mascota</h1>

        <fieldset class="form-propietario d-flex flex-column gap-2 p-2 rounded d-lg-grid">
            <legend class="title-bold">Datos del Propietario</legend>

            <div class="d-flex flex-column gap-1">
                <label for="cedula_prop">Cédula de identidad</label>
                <input id="cedula_prop" type="text" readonly value="1712345678" class="w-100 bg-grey-color" title="Campo de solo lectura">
            </div>

            <div class="d-flex flex-column gap-1">
                <label for="telefono_prop">Teléfono</label>
                <input id="telefono_prop" type="tel" readonly value="0987654321" class="w-100 bg-grey-color" title="Campo de solo lectura">
            </div>

            <div class="d-flex gap-2 grid-lg-full-width">
                <div class="d-flex flex-column gap-1 w-50">
                    <label for="nombres_prop">Nombres</label>
                    <input id="nombres_prop" type="text" readonly value="María Belén" class="w-100 bg-grey-color" title="Campo de solo lectura">
                </div>
                <div class="d-flex flex-column gap-1 w-50">
                    <label for="apellidos_prop">Apellidos</label>
                    <input id="apellidos_prop" type="text" readonly value="Espinoza Castro" class="w-100 bg-grey-color" title="Campo de solo lectura">
                </div>
            </div>

            <div class="d-flex flex-column gap-1 grid-lg-full-width">
                <label for="correo_prop">Correo electrónico</label>
                <input id="correo_prop" type="email" readonly value="m.espinoza@email.com" class="w-100 bg-grey-color" title="Campo de solo lectura">
            </div>
        </fieldset>

        <fieldset class="d-flex flex-column gap-2 p-2 rounded">
            <legend class="title-bold">Datos de la Mascota</legend>

            <div class="d-flex gap-2">
                <div class="d-flex flex-column gap-1 w-50">
                    <label for="nombre_mascota">Nombre</label>
                    <input id="nombre_mascota" type="text" readonly value="Max" class="w-100 bg-grey-color" title="Campo de solo lectura">
                </div>
                <div class="d-flex flex-column gap-1 w-50">
                    <label for="especie">Especie</label>
                    <input id="especie" type="text" readonly value="Perro" class="w-100 bg-grey-color" title="Campo de solo lectura">
                </div>
            </div>

            <div class="d-flex gap-2">
                <div class="d-flex flex-column gap-1 w-50">
                    <label for="sexo_mascota">Sexo</label>
                    <input id="sexo_mascota" type="text" readonly value="Macho" class="w-100 bg-grey-color" title="Campo de solo lectura">
                </div>
                <div class="d-flex flex-column gap-1 w-50">
                    <label for="peso">Peso (kg)</label>
                    <input id="peso" type="number" readonly value="12.5" step="0.1" class="w-100 bg-grey-color" title="Campo de solo lectura">
                </div>
            </div>

            <div class="d-flex flex-column flex-lg-row gap-2">
                <div class="d-flex flex-column gap-1 w-lg-50">
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input id="fecha_nacimiento" type="date" readonly value="2024-05-15" class="w-100 bg-grey-color" title="Campo de solo lectura">
                </div>
                <div class="d-flex flex-column gap-1 w-lg-50">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" readonly rows="2" class="w-100 p-1 rounded bd-grey-color bg-grey-color" title="Campo de solo lectura">Vacunas al día. Sin alergias conocidas.</textarea>
                </div>
            </div>
        </fieldset>

        <a href="mascotas-listado.html" class="menu-button bg-terciary-color secondary-color a-decoration-none p-2 rounded text-center w-100 w-lg-25 aling-self-center">Regresar</a>
    </main>
    <footer class="p-3">
        <p>© 2026 Clínica Veterinaria Huellitas - Sistema de Gestión Interna</p>
    </footer>
</body>
</html>
